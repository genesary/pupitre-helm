suite: external secret
templates:
  - externalsecret.yaml
release:
  name: pupitre
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: syncs <release>-secrets from the configured store
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef:
        name: vault
        kind: ClusterSecretStore
      externalSecret.dataFrom:
        - extract:
            key: pupitre/api
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: pupitre-secrets
      - equal:
          path: spec.target.name
          value: pupitre-secrets
      - equal:
          path: spec.secretStoreRef
          value:
            name: vault
            kind: ClusterSecretStore
      - equal:
          path: spec.dataFrom
          value:
            - extract:
                key: pupitre/api
      - notExists:
          path: spec.data

  - it: creates existingSecret when it is named
    set:
      externalSecret.enabled: true
      existingSecret: pupitre-credentials
    asserts:
      - equal:
          path: spec.target.name
          value: pupitre-credentials
