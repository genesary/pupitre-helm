suite: service accounts
templates:
  - api/serviceaccount.yaml
release:
  name: pupitre
tests:
  - it: creates <release>-api by default
    asserts:
      - equal:
          path: metadata.name
          value: pupitre-api

  - it: names and annotates the created service account
    set:
      api.serviceAccount.name: pupitre-backend
      api.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/pupitre
    asserts:
      - equal:
          path: metadata.name
          value: pupitre-backend
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/pupitre

  - it: creates no service account when an existing one is used
    set:
      api.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
