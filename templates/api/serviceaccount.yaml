{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pupitre.serviceAccountName" (dict "root" . "component" "api" "serviceAccount" .Values.api.serviceAccount) }}
  labels:
    {{- include "pupitre.api.labels" . | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The API reads its data from PostgreSQL and Git, never from the
# Kubernetes API, so its pods are given no API credentials.
automountServiceAccountToken: false
{{- end }}
