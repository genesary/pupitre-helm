{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pupitre.fullname" . }}-frontend
  labels:
    {{- include "pupitre.frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pupitre.frontend.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: {{ .Values.frontend.service.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "pupitre.userService.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.userService.service.port }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "pupitre.courseService.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.courseService.service.port }}
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
