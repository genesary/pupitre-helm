apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pupitre.fullname" . }}-frontend-config
  labels:
    {{- include "pupitre.frontend.labels" . | nindent 4 }}
data:
  config.env: |
    PORT={{ .Values.frontend.service.port }}
    NODE_ENV=production
    ORIGIN={{ include "pupitre.publicUrl" . }}
    PUBLIC_API_URL={{ include "pupitre.publicUrl" . }}
    INTERNAL_API_URL=http://{{ include "pupitre.fullname" . }}-user-service:{{ .Values.userService.service.port }}
    COURSE_API=http://{{ include "pupitre.fullname" . }}-course-service:{{ .Values.courseService.service.port }}
    USER_API=http://{{ include "pupitre.fullname" . }}-user-service:{{ .Values.userService.service.port }}
