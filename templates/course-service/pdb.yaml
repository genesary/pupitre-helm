{{- if gt (int .Values.courseService.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pupitre.fullname" . }}-course-service
  labels:
    {{- include "pupitre.courseService.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "pupitre.courseService.selectorLabels" . | nindent 6 }}
{{- end }}
