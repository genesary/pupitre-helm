---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pupitre.fullname" . }}-course-service
  labels:
    {{- include "pupitre.courseService.labels" . | nindent 4 }}
# The service reads its content from PostgreSQL and Git, never from the
# Kubernetes API, so its pods are given no API credentials.
automountServiceAccountToken: false
