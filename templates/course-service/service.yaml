apiVersion: v1
kind: Service
metadata:
  name: {{ include "pupitre.fullname" . }}-course-service
  labels:
    {{- include "pupitre.courseService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.courseService.service.type }}
  ports:
    - port: {{ .Values.courseService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.courseService.service.nodePort }}
      nodePort: {{ .Values.courseService.service.nodePort }}
      {{- end }}
  selector:
    {{- include "pupitre.courseService.selectorLabels" . | nindent 4 }}
