{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pupitre.fullname" . }}-user-service
  labels:
    {{- include "pupitre.userService.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pupitre.userService.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pupitre.frontend.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "pupitre.courseService.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.userService.service.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "pupitre.courseService.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.courseService.service.port }}
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "pupitre.name" . }}
              app.kubernetes.io/component: postgresql
      ports:
        - port: 5432
    {{- end }}
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # External DB / Vault
    - ports:
        - port: 5432
        - port: 443
{{- end }}
