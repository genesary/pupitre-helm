apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pupitre.fullname" . }}-user-service
  labels:
    {{- include "pupitre.userService.labels" . | nindent 4 }}
# The service reads its patterns from PostgreSQL, never from the
# Kubernetes API, so its pods are given no API credentials.
automountServiceAccountToken: false
