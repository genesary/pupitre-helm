apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pupitre.fullname" . }}-secrets
  labels:
    {{- include "pupitre.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.jwtExistingSecret }}
  JWT_SECRET: {{ .Values.jwtSecret | quote }}
  {{- end }}
  {{- if not .Values.internalServiceExistingSecret }}
  INTERNAL_SERVICE_SECRET: {{ .Values.internalServiceSecret | quote }}
  {{- end }}
  {{- if ne (include "pupitre.databaseUrlFromExternalSecret" .) "true" }}
  DATABASE_URL: {{ include "pupitre.databaseUrl" . | quote }}
  {{- end }}
  {{- if not .Values.admin.existingSecret }}
  ADMIN_PASSWORD: {{ include "pupitre.adminPassword" . | quote }}
  {{- end }}
  {{- if and .Values.courseService.gitToken (not .Values.courseService.gitTokenExistingSecret) }}
  GIT_TOKEN: {{ .Values.courseService.gitToken | quote }}
  {{- end }}
  {{- if and .Values.sso.oidc.enabled .Values.sso.oidc.clientSecret (not .Values.sso.oidc.existingSecret) }}
  OIDC_CLIENT_SECRET: {{ .Values.sso.oidc.clientSecret | quote }}
  {{- end }}
  {{- if .Values.sso.enabled }}
  {{- range .Values.sso.providers }}
  {{- if and .clientSecret (not .existingSecret) }}
  SSO_{{ .id | upper }}_CLIENT_SECRET: {{ .clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.checkerService.gitLabToken }}
  GITLAB_TOKEN: {{ .Values.checkerService.gitLabToken | quote }}
  {{- end }}
